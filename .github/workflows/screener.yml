name: Stock Data Collector FAST

on:
  workflow_dispatch:
  schedule:
    # 1. KST 평일 오전 8:00 정각 (UTC 전날 23:00) - 날짜 변경 및 아침 수급
    - cron: '0 23 * * 0-4'
    
    # 2. KST 평일 오전 9:00, 10:00, 11:00 정각 (UTC 00:00 ~ 02:00)
    - cron: '0 0-2 * * 1-5'
    
    # 3. KST 평일 12:00 ~ 15:30 장중 10분 간격 (UTC 03:00 ~ 06:30)
    - cron: '*/10 3-6 * * 1-5'
    
    # 4. KST 평일 15:30 이후 장 마감/시간외 30분 간격 (UTC 06:30 ~ 09:00)
    - cron: '0,30 6-9 * * 1-5'

concurrency:
  group: stock-data-collector-fast
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run collector
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: |
          python collector.py

      - name: Show validation
        if: always()
        run: |
          python - <<'PY'
          import json
          import os

          if not os.path.exists("data.json"):
              print("data.json not created")
              raise SystemExit(0)

          with open("data.json", "r", encoding="utf-8") as f:
              d = json.load(f)

          print("status:", d.get("status"))
          print("count:", d.get("count"))
          print("validation:", d.get("validation"))
          PY

      - name: Commit data.json
        if: always()
        run: |
          if [ ! -f data.json ]; then
            echo "No data.json to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Auto Update investor flow data: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git push
