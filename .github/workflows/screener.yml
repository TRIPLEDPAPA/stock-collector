name: Daily Stock Screener

on:
  schedule:
    - cron: '30 6 * * 1-5' # 평일 한국시간 15:30 자동실행
  workflow_dispatch:        # 수동 실행 버튼

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 의존성 설치
        run: |
          pip install requests supabase pandas

      - name: 스크리너 실행
        env:
          SUPABASE_URL: "https://xnjnknhwezminpdmsrtm.supabase.co"
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python collector.py
