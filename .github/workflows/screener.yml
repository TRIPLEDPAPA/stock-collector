name: Stock Data Collector FAST

on:
  workflow_dispatch:
  schedule:
    - cron: '0,30 6 * * 1-5'

concurrency:
  group: stock-data-collector-fast
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run collector
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: |
          python collector.py

      - name: Show validation
        if: always()
        run: |
          python - <<'PY'
          import json
          import os

          if not os.path.exists("data.json"):
              print("data.json not created")
              raise SystemExit(0)

          with open("data.json", "r", encoding="utf-8") as f:
              d = json.load(f)

          print("status:", d.get("status"))
          print("count:", d.get("count"))
          print("validation:", d.get("validation"))
          PY

      - name: Commit data.json
        if: always()
        run: |
          if [ ! -f data.json ]; then
            echo "No data.json to commit."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json

          if git diff --cached --quiet; then
            echo "No changes."
            exit 0
          fi

          git commit -m "Update investor flow data"
          git push
