name: Stock Screener & Collector

on:
  schedule:
    # 1. 한국시간 매일 00:00 (UTC 15:00) -> 자정 기준일자 리셋
    - cron: '0 15 * * *'
    # 2. 한국시간 평일 09:00 (UTC 00:00) -> 09시 전체 수집 및 분석 재실행
    - cron: '0 0 * * 1-5'
  workflow_dispatch: # Actions 탭에서 수동 즉시 실행

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'stock-pages'
  cancel-in-progress: false

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pytz requests pandas websockets
          fi

      - name: Ensure Initial data.json Exists
        run: |
          # data.json이 없어서 생기는 웹 404 에러를 원천 차단
          if [ ! -f data.json ]; then
            echo "Creating initial data.json fallback..."
            CURRENT_DATE=$(TZ='Asia/Seoul' date +'%Y-%m-%d')
            CURRENT_TIME=$(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M:%S')
            cat <<EOF > data.json
          {
            "base_date": "$CURRENT_DATE",
            "last_updated": "$CURRENT_TIME",
            "status": "초기 데이터 대기 중",
            "summary": {
              "total_count": 0,
              "conditions": "시가 > 전일 종가, 5>10>20일 정배열"
            },
            "items": []
          }
          EOF
          fi

      - name: Run Screener (KST Time Based)
        env:
          TZ: 'Asia/Seoul'
          APP_KEY: ${{ secrets.APP_KEY }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
        run: |
          export CURRENT_DATE=$(TZ='Asia/Seoul' date +'%Y-%m-%d')
          export KST_HOUR=$(TZ='Asia/Seoul' date +'%H')
          echo "=========================================="
          echo "실행 기준일자: $CURRENT_DATE"
          echo "현재 한국 시간(시): ${KST_HOUR}시"
          echo "=========================================="

          # 00시~01시면 reset 모드, 그 외(09시 또는 수동실행)면 full 모드
          if [ "$KST_HOUR" -eq "00" ] || [ "$KST_HOUR" -eq "01" ]; then
            EXEC_MODE="reset"
          else
            EXEC_MODE="full"
          fi

          if [ -f screener.py ]; then
            python screener.py --mode $EXEC_MODE
          elif [ -f collector.py ]; then
            python collector.py --mode $EXEC_MODE
          elif [ -f main.py ]; then
            python main.py --mode $EXEC_MODE
          else
            echo "파이썬 실행 스크립트가 없습니다. 기본 data.json으로 계속 진행합니다."
          fi

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "Auto Update: $(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M:%S')" && git push origin main)

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
