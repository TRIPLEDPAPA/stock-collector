name: Stock Data Collector

on:
  schedule:
    - cron: '*/30 0-14 * * 1-5' # 평일 30분 간격 자동 수집
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install requests supabase yfinance

      - name: Run Collector
        run: |
          python collector.py
