name: Stock Data Collector FAST

on:
  workflow_dispatch:
  schedule:
    - cron: '0,30 6 * * 1-5'

concurrency:
  group: stock-data-collector-fast
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-latestt-mi
    timeounutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install
        run: pip install requests
      - name: Run fast collector
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: python collector.py
      - name: Show validation
        if: always()
        run: |
          python - <<'PY'
          import json, os
          if os.path.exists("data.json"):
              d=json.load(open("data.json",encoding="utf-8"))
              print("status:",d.get("status"))
              print("count:",d.get("count"))
              print("validation:",d.get("validation"))
          PY
      - name: Commit data
        if: always()
        run: |
          test -f data.json || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          git diff --cached --quiet && exit 0
          git commit -m "Update investor flow data"
          git push
