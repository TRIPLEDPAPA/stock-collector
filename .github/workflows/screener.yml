name: Stock Data Collector

on:
  schedule:
    - cron: '*/30 0-14 * * 1-5'
  workflow_dispatch:

concurrency:
  group: stock-data-collector
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests supabase python-dotenv

      - name: Check required secrets
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
        run: |
          python - <<'PY'
          import os, sys
          missing = [k for k in ("KIS_APP_KEY", "KIS_APP_SECRET") if not os.getenv(k)]
          if missing:
              print("::error::Missing GitHub Actions secrets: " + ", ".join(missing))
              sys.exit(1)
          print("KIS secrets are configured.")
          PY

      - name: Run Collector
        env:
          KIS_APP_KEY: ${{ secrets.KIS_APP_KEY }}
          KIS_APP_SECRET: ${{ secrets.KIS_APP_SECRET }}
          DART_API_KEY: ${{ secrets.DART_API_KEY }}
          KRX_API_KEY: ${{ secrets.KRX_API_KEY }}
          KIS_REQUEST_INTERVAL: '0.08'
        run: |
          python collector.py

      - name: Validate data.json
        run: |
          python - <<'PY'
          import json
          with open("data.json", "r", encoding="utf-8") as f:
              d = json.load(f)
          print("status =", d.get("status"))
          print("count  =", d.get("count"))
          print("errors =", d.get("validation", {}).get("errors", []))
          print("render_allowed =", d.get("validation", {}).get("render_allowed"))
          PY

      - name: Commit and push data.json
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data.json
          if git diff --cached --quiet; then
            echo "No data.json changes."
            exit 0
          fi
          git commit -m "Auto Update data.json: $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
          git push
