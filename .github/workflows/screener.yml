name: Daily Stock Screener

on:
  schedule:
    - cron: '30 6 * * 1-5' # 평일 15시 30분 자동 실행
  workflow_dispatch:        # 수동 실행 지원

jobs:
  run-screener:
    runs-on: ubuntu-latest

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: 파이썬 설정
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 의존성 라이브러리 설치
        run: |
          pip install requests supabase pandas finance-datareader

      - name: 스크리너 실행 (오픈소스 엔진)
        env:
          SUPABASE_URL: "https://xnjnknhwezminpdmsrtm.supabase.co"
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: |
          python collector.py
