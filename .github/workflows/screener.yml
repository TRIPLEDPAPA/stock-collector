name: Stock Screener & Collector

on:
  schedule:
    - cron: '0 15 * * *'
    - cron: '0 0 * * 1-5'
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytz requests pandas websockets

      - name: Ensure Initial data.json
        run: |
          python -c "
          import os, json
          from datetime import datetime
          import pytz
          if not os.path.exists('data.json'):
              kst = pytz.timezone('Asia/Seoul')
              now = datetime.now(kst)
              data = {
                  'base_date': now.strftime('%Y-%m-%d'),
                  'last_updated': now.strftime('%Y-%m-%d %H:%M:%S'),
                  'status': 'Ready',
                  'summary': {'total_count': 0, 'conditions': 'Open > PrevClose, 5>10>20 MA'},
                  'items': []
              }
              with open('data.json', 'w', encoding='utf-8') as f:
                  json.dump(data, f, ensure_ascii=False, indent=2)
          "

      - name: Run Screener
        env:
          TZ: 'Asia/Seoul'
          APP_KEY: ${{ secrets.APP_KEY }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
        run: |
          CURRENT_DATE=$(TZ='Asia/Seoul' date +'%Y-%m-%d')
          KST_HOUR=$(TZ='Asia/Seoul' date +'%H')
          echo "Date: $CURRENT_DATE, Hour: $KST_HOUR"

          if [ "$KST_HOUR" -eq "00" ] || [ "$KST_HOUR" -eq "01" ]; then
            MODE="reset"
          else
            MODE="full"
          fi

          if [ -f screener.py ]; then
            python screener.py --mode $MODE || true
          elif [ -f collector.py ]; then
            python collector.py --mode $MODE || true
          elif [ -f main.py ]; then
            python main.py --mode $MODE || true
          fi

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "Auto Update: $(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M:%S')" && git push origin main) || true

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
