name: Stock Screener & Collector

on:
  schedule:
    # 1. 한국시간(KST) 매일 00:00 (UTC 15:00) -> 자정 기준일자 리셋
    - cron: '0 15 * * *'
    # 2. 한국시간(KST) 평일 09:00 (UTC 00:00) -> 09시 전체 스크리너 재실행
    - cron: '0 0 * * 1-5'
  workflow_dispatch: # GitHub 웹 Actions 탭에서 수동 실행 지원

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: 'stock-pages'
  cancel-in-progress: false

jobs:
  build-and-run:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install pytz requests pandas websockets
          fi

      - name: Run Screener (KST Time Based)
        env:
          TZ: 'Asia/Seoul'
          APP_KEY: ${{ secrets.APP_KEY }}
          APP_SECRET: ${{ secrets.APP_SECRET }}
        run: |
          export CURRENT_DATE=$(TZ='Asia/Seoul' date +'%Y-%m-%d')
          export KST_HOUR=$(TZ='Asia/Seoul' date +'%H')
          echo "=========================================="
          echo "실행 기준일자: $CURRENT_DATE"
          echo "현재 한국 시간(시): ${KST_HOUR}시"
          echo "=========================================="

          # 00시~01시면 reset 모드, 그 외(09시/수동)면 full 모드 실행
          if [ "$KST_HOUR" -eq "00" ] || [ "$KST_HOUR" -eq "01" ]; then
            EXEC_MODE="reset"
          else
            EXEC_MODE="full"
          fi

          if [ -f screener.py ]; then
            python screener.py --mode $EXEC_MODE
          elif [ -f collector.py ]; then
            python collector.py --mode $EXEC_MODE
          elif [ -f main.py ]; then
            python main.py --mode $EXEC_MODE
          else
            echo "실행할 파이썬 파일을 찾지 못했습니다."
          fi

      - name: Commit and Push Updated Data
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || (git commit -m "Auto Update: $(TZ='Asia/Seoul' date +'%Y-%m-%d %H:%M:%S')" && git push origin main)

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
