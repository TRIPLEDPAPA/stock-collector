name: TRIPLE D PAPA Auto Collector

on:
  schedule:
    # 매일 한국 시간 오전 9시 정각 (UTC 기준 0시 0분)에 자동 실행
    - cron: '0 0 * * *'
    
  workflow_dispatch: # GitHub Actions 탭에서 수동으로 즉시 실행 가능

jobs:
  run-collector:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests supabase

      - name: Run stock collector script
        run: |
          python collector.py
