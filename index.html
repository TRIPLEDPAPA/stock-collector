<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TRIPLE D PAPA - 실시간 종가배팅 전광판</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-sub: #94a3b8;
      --red: #ef4444;
      --blue: #38bdf8;
      --accent: #38bdf8;
      --orange: #f97316;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 14px; min-height: 100vh; }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
    h1 { font-size: 1.15rem; font-weight: 700; color: #fff; }
    .header-right { display: flex; align-items: center; gap: 8px; }
    .status-badge { display: flex; align-items: center; gap: 5px; font-size: 0.72rem; background-color: rgba(56, 189, 248, 0.15); color: var(--accent); padding: 4px 8px; border-radius: 999px; font-weight: 600; }
    .live-dot { width: 6px; height: 6px; background-color: #10b981; border-radius: 50%; display: inline-block; animation: pulse 1.5s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
    
    .refresh-btn { background: #2563eb; color: #fff; border: none; border-radius: 6px; padding: 5px 9px; font-size: 0.75rem; font-weight: 700; cursor: pointer; }
    .refresh-btn:disabled { background: #475569; cursor: not-allowed; }

    /* 마켓 탭 */
    .market-tab-bar { display: flex; gap: 8px; margin-bottom: 8px; }
    .tab-btn { flex: 1; padding: 7px 0; border-radius: 8px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text-sub); font-size: 0.82rem; font-weight: 700; cursor: pointer; text-align: center; }
    .tab-btn.active { background: var(--accent); color: #0f172a; border-color: var(--accent); }

    /* 거래대금 필터 탭 (가로 스크롤 지원) */
    .amount-filter-scroll { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 4px; margin-bottom: 10px; scrollbar-width: none; }
    .amount-filter-scroll::-webkit-scrollbar { display: none; }
    .amt-btn { flex: 0 0 auto; padding: 5px 11px; border-radius: 6px; border: 1px solid var(--border); background: #1e293b; color: #94a3b8; font-size: 0.75rem; font-weight: 600; cursor: pointer; }
    .amt-btn.active { background: #f59e0b; color: #0f172a; border-color: #f59e0b; font-weight: 700; }

    /* 쌍끌이 필터 토글 */
    .filter-ctrl-bar { display: flex; justify-content: space-between; align-items: center; background: rgba(30, 41, 59, 0.7); padding: 9px 12px; border-radius: 8px; border: 1px solid var(--border); margin-bottom: 12px; }
    .toggle-label { display: flex; align-items: center; gap: 8px; font-size: 0.82rem; font-weight: 600; color: #cbd5e1; cursor: pointer; user-select: none; }
    .toggle-checkbox { width: 16px; height: 16px; accent-color: var(--orange); cursor: pointer; }

    .summary-bar { display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--text-sub); margin-bottom: 12px; }
    .stock-list { display: flex; flex-direction: column; gap: 10px; }
    .stock-card { background-color: var(--card-bg); border-radius: 12px; padding: 12px 14px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2); cursor: pointer; transition: transform 0.1s ease; }
    .stock-card:active { transform: scale(0.99); }
    .stock-card.card-double-border { border: 1px solid rgba(249, 115, 22, 0.6); }
    
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .stock-title-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
    .stock-name { font-size: 1.05rem; font-weight: 700; }
    .stock-market { font-size: 0.68rem; padding: 2px 5px; border-radius: 4px; font-weight: 600; }
    .market-KOSPI { background: #3b82f6; color: #fff; }
    .market-KOSDAQ { background: #10b981; color: #fff; }
    
    .score-badge { font-size: 0.7rem; background: rgba(56, 189, 248, 0.2); color: var(--accent); padding: 1px 6px; border-radius: 4px; font-weight: 700; }
    .double-badge { font-size: 0.7rem; background: rgba(249, 115, 22, 0.2); color: #fb923c; border: 1px solid rgba(249, 115, 22, 0.4); padding: 1px 6px; border-radius: 4px; font-weight: 700; }

    .investor-bar { margin-top: 5px; display: flex; gap: 4px; flex-wrap: wrap; }
    .badge-inv { font-size: 0.68rem; padding: 2px 5px; border-radius: 4px; font-weight: 600; }
    .inv-buy { color: #f87171; background: rgba(239, 68, 68, 0.15); }
    .inv-sell { color: #60a5fa; background: rgba(59, 130, 246, 0.15); }
    .inv-zero { color: var(--text-sub); background: rgba(148, 163, 184, 0.1); }

    .stock-values { text-align: right; display: flex; flex-direction: column; gap: 2px; }
    .stock-price { font-size: 1.1rem; font-weight: 700; color: #fff; }
    .stock-rate { font-size: 0.82rem; font-weight: 700; color: var(--red); }
    .stock-rate.down { color: var(--blue); }

    .chips-box { display: flex; flex-wrap: wrap; gap: 4px; padding-top: 6px; border-top: 1px dashed var(--border); }
    .chip { font-size: 0.65rem; padding: 2px 5px; border-radius: 4px; font-weight: 500; }
    .chip-pass { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .chip-fail { background: rgba(51, 65, 85, 0.4); color: #64748b; }

    .card-bottom { display: flex; justify-content: space-between; align-items: center; font-size: 0.72rem; color: var(--text-sub); }
    .amount-highlight { color: #f59e0b; font-weight: 700; }
    .loading, .empty { text-align: center; padding: 40px 0; color: var(--text-sub); font-size: 0.88rem; }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>TRIPLE D PAPA</h1>
      <div id="target-date" style="font-size: 0.72rem; color: var(--text-sub); margin-top: 2px;">연결 중...</div>
    </div>
    <div class="header-right">
      <button class="refresh-btn" id="btn-refresh" onclick="loadStockData()">⚡ 새로고침</button>
      <div class="status-badge">
        <span class="live-dot"></span>
        <span>LIVE</span>
      </div>
    </div>
  </header>

  <!-- 1. 시장 선택 탭 -->
  <div class="market-tab-bar">
    <button class="tab-btn active" onclick="setMarketFilter('ALL')">전체</button>
    <button class="tab-btn" onclick="setMarketFilter('KOSPI')">코스피</button>
    <button class="tab-btn" onclick="setMarketFilter('KOSDAQ')">코스닥</button>
  </div>

  <!-- 2. 거래대금 필터 탭 (100억 ~ 500억 이상) -->
  <div class="amount-filter-scroll">
    <button class="amt-btn active" onclick="setAmountFilter(0)">전체대금</button>
    <button class="amt-btn" onclick="setAmountFilter(100)">100억 이상</button>
    <button class="amt-btn" onclick="setAmountFilter(200)">200억 이상</button>
    <button class="amt-btn" onclick="setAmountFilter(300)">300억 이상</button>
    <button class="amt-btn" onclick="setAmountFilter(400)">400억 이상</button>
    <button class="amt-btn" onclick="setAmountFilter(500)">500억 이상</button>
  </div>

  <!-- 3. 쌍끌이 필터 토글 -->
  <div class="filter-ctrl-bar">
    <label class="toggle-label" for="double-buy-toggle">
      <input type="checkbox" id="double-buy-toggle" class="toggle-checkbox" onchange="toggleDoubleBuyFilter()">
      <span>🔥 외인+기관 쌍끌이만 보기</span>
    </label>
    <span id="double-count-info" style="font-size: 0.75rem; color: #fb923c; font-weight: 700;"></span>
  </div>

  <div class="summary-bar">
    <span id="summary-count">데이터 불러오는 중...</span>
    <span id="last-updated"></span>
  </div>

  <div class="stock-list" id="stock-container">
    <div class="loading">최신 데이터를 불러오는 중입니다...</div>
  </div>

  <script>
    const SUPABASE_URL = "https://xnjnknhwezminpdmsrtm.supabase.co";
    const SUPABASE_ANON_KEY = "sb_publishable_qBB0Q_OsOCcHWtSNoXsyZg_raCUUTfn";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    const ALL_CONDS = ["주가등락률", "거래대금", "거래량비율", "20일이평선", "주가위치", "양봉마감", "고가근접", "윗꼬리제한", "단기이평정배열"];

    let allStocks = [];
    let currentMarket = 'ALL';
    let minAmountEok = 0; // 0, 100, 200, 300, 400, 500
    let onlyDoubleBuy = false;

    async function loadStockData() {
      const btn = document.getElementById("btn-refresh");
      btn.disabled = true;
      btn.innerText = "조회중...";

      try {
        const { data, error } = await supabaseClient
          .from("TRIPLE D PAPA")
          .select("*")
          .order("trade_amount", { ascending: false });

        if (error) throw error;

        allStocks = data || [];

        if (allStocks.length > 0) {
          const latestDate = allStocks[0].date || "";
          document.getElementById("target-date").innerText = `기준일자: ${latestDate}`;
        } else {
          document.getElementById("target-date").innerText = "적재된 데이터 없음";
        }

        const now = new Date();
        document.getElementById("last-updated").innerText = "방금 갱신됨 (" + now.toLocaleTimeString('ko-KR', { hour12: false }) + ")";

        renderList();
      } catch (err) {
        console.error("데이터 로드 오류:", err);
        document.getElementById("stock-container").innerHTML = `<div class="empty">데이터를 불러오지 못했습니다.<br><span style="font-size:0.75rem; color:#ef4444;">${err.message || err}</span></div>`;
      } finally {
        btn.disabled = false;
        btn.innerText = "⚡ 새로고침";
      }
    }

    function renderBadge(label, vol) {
      if (!vol || vol === 0) return `<span class="badge-inv inv-zero">${label} 0</span>`;
      const abs = Math.abs(vol);
      const text = abs >= 10000 ? (vol / 10000).toFixed(1) + "만" : Number(vol).toLocaleString();
      return vol > 0 ? `<span class="badge-inv inv-buy">${label} +${text}</span>` : `<span class="badge-inv inv-sell">${label} ${text}</span>`;
    }

    function setMarketFilter(m) {
      currentMarket = m;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      renderList();
    }

    function setAmountFilter(amt) {
      minAmountEok = amt;
      document.querySelectorAll('.amt-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      renderList();
    }

    function toggleDoubleBuyFilter() {
      onlyDoubleBuy = document.getElementById("double-buy-toggle").checked;
      renderList();
    }

    function renderList() {
      const container = document.getElementById("stock-container");
      
      // 1. 시장 필터
      let filtered = currentMarket === 'ALL' ? allStocks : allStocks.filter(s => s.market === currentMarket);

      // 2. 거래대금 필터 (억 단위 계산)
      if (minAmountEok > 0) {
        filtered = filtered.filter(s => {
          const eok = (s.trade_amount || 0) / 100000000;
          return eok >= minAmountEok;
        });
      }

      // 3. 쌍끌이 수치 집계
      const doubleCount = filtered.filter(s => s.foreign_net_buy > 0 && s.inst_net_buy > 0).length;
      document.getElementById("double-count-info").innerText = doubleCount > 0 ? `(${doubleCount}개)` : `(0개)`;

      // 4. 쌍끌이 필터 토글 적용
      if (onlyDoubleBuy) {
        filtered = filtered.filter(s => s.foreign_net_buy > 0 && s.inst_net_buy > 0);
      }

      document.getElementById("summary-count").innerText = `선별 종목: ${filtered.length}개`;

      if (filtered.length === 0) {
        container.innerHTML = '<div class="empty">해당 조건의 종목이 없습니다.</div>';
        return;
      }

      container.innerHTML = filtered.map(s => {
        const tags = (s.passed_tags || "").split(',');
        const isDouble = (s.foreign_net_buy > 0 && s.inst_net_buy > 0);
        const score = s.pass_count || tags.filter(t => t && t !== "쌍끌이매수").length;
        const amountEok = Math.round((s.trade_amount || 0) / 100000000).toLocaleString();

        const chipsHtml = ALL_CONDS.map(c => {
          const pass = tags.includes(c);
          return `<span class="chip ${pass ? 'chip-pass' : 'chip-fail'}">${pass ? '✔ ' : ''}${c}</span>`;
        }).join('');

        const isPositive = s.change_rate >= 0;

        return `
          <div class="stock-card ${isDouble ? 'card-double-border' : ''}" onclick="window.open('https://m.stock.naver.com/domestic/stock/${s.ticker}/total', '_blank')">
            <div class="card-top">
              <div class="stock-info">
                <div class="stock-title-row">
                  <span class="stock-market market-${s.market}">${s.market}</span>
                  <span class="stock-name">${s.name}</span>
                  ${isDouble ? '<span class="double-badge">🔥 쌍끌이</span>' : ''}
                  <span class="score-badge">${score}/9</span>
                </div>
                <div class="investor-bar">
                  ${renderBadge("외인", s.foreign_net_buy)}
                  ${renderBadge("기관", s.inst_net_buy)}
                  ${renderBadge("개인", s.retail_net_buy)}
                </div>
              </div>
              <div class="stock-values">
                <div class="stock-price">${Number(s.close_price || 0).toLocaleString()}원</div>
                <div class="stock-rate ${isPositive ? '' : 'down'}">${isPositive ? '+' : ''}${s.change_rate}%</div>
              </div>
            </div>

            <div class="chips-box">
              ${chipsHtml}
            </div>

            <div class="card-bottom">
              <span>시가 ${Number(s.open_price || 0).toLocaleString()}원</span>
              <span class="amount-highlight">거래대금 ${amountEok}억</span>
            </div>
          </div>
        `;
      }).join('');
    }

    loadStockData();
  </script>
</body>
</html>
