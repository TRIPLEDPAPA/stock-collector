<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주식 스크리너 - 실시간 수집 현황</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      color: #0f172a;
      margin: 0;
      padding: 20px;
    }
    .card {
      max-width: 1080px;
      margin: 0 auto;
      background: #ffffff;
      padding: 24px;
      border-radius: 10px;
      box-shadow: 0 4px 6px -1px rgba(0,0,0,0.07);
    }
    header {
      border-bottom: 2px solid #f1f5f9;
      padding-bottom: 16px;
      margin-bottom: 16px;
    }
    .meta-box {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 10px;
      font-size: 14px;
    }
    .badge-date {
      background: #e0f2fe;
      color: #0369a1;
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: 700;
    }
    .badge-status {
      background: #f1f5f9;
      color: #334155;
      padding: 4px 10px;
      border-radius: 6px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
      font-size: 14px;
    }
    th, td {
      border: 1px solid #e2e8f0;
      padding: 10px 8px;
      text-align: center;
    }
    th {
      background: #f8fafc;
      color: #475569;
    }
    .text-up { color: #dc2626; font-weight: 600; }
    .text-down { color: #2563eb; font-weight: 600; }
    .empty {
      text-align: center;
      padding: 50px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="card">
    <header>
      <h2 style="margin: 0;">주식 스크리너 (시가 갭상승 & 정배열)</h2>
      <div class="meta-box">
        <div>기준일자: <span id="base-date" class="badge-date">확인 중...</span></div>
        <div>최종 갱신: <span id="last-updated">확인 중...</span></div>
        <div>진행 상태: <span id="status-text" class="badge-status">-</span></div>
      </div>
    </header>

    <div style="overflow-x: auto;">
      <table>
        <thead>
          <tr>
            <th>종목코드</th>
            <th>종목명</th>
            <th>현재가</th>
            <th>등락률</th>
            <th>시가(갭)</th>
            <th>거래량</th>
            <th>이평선</th>
            <th>PER</th>
            <th>PBR</th>
            <th>ROE</th>
            <th>RSI</th>
          </tr>
        </thead>
        <tbody id="result-body">
          <tr>
            <td colspan="11" class="empty">데이터를 불러오는 중입니다...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    async function refreshData() {
      try {
        const response = await fetch('./data.json?cache=' + Date.now());
        if (!response.ok) throw new Error('data.json 로드 실패');
        const data = await response.json();

        document.getElementById('base-date').textContent = data.base_date;
        document.getElementById('last-updated').textContent = data.last_updated;
        document.getElementById('status-text').textContent = data.status;

        const tbody = document.getElementById('result-body');
        tbody.innerHTML = '';

        if (!data.items || data.items.length === 0) {
          tbody.innerHTML = '<tr><td colspan="11" class="empty">현재 조건(시가 > 전일 종가, 이평선 정배열 등)을 만족하는 종목이 없거나 장 시작 전 대기 상태입니다.</td></tr>';
          return;
        }

        data.items.forEach(item => {
          const tr = document.createElement('tr');
          const isUp = item.diff_pct > 0;
          const diffClass = isUp ? 'text-up' : (item.diff_pct < 0 ? 'text-down' : '');
          const sign = isUp ? '+' : '';

          tr.innerHTML = `
            <td>${item.code}</td>
            <td style="font-weight:600;">${item.name}</td>
            <td>${Number(item.close).toLocaleString()}원</td>
            <td class="${diffClass}">${sign}${item.diff_pct}%</td>
            <td>${Number(item.open).toLocaleString()}원 <span class="text-up">(+${item.gap_pct}%)</span></td>
            <td>${Number(item.volume).toLocaleString()}주</td>
            <td>${item.ma_status}</td>
            <td>${item.per}</td>
            <td>${item.pbr}</td>
            <td>${item.roe}%</td>
            <td>${item.rsi14}</td>
          `;
          tbody.appendChild(tr);
        });
      } catch (err) {
        document.getElementById('base-date').textContent = '연결 오류';
        document.getElementById('result-body').innerHTML = '<tr><td colspan="11" class="empty" style="color:#ef4444;">data.json 파일을 읽을 수 없습니다. Actions 빌드 로그를 확인해주세요.</td></tr>';
      }
    }

    refreshData();
  </script>
</body>
</html>
