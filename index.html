<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TRIPLE D PAPA - 종가배팅 스크리너</title>
  <!-- Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg-dark: #0f172a;
      --card-bg: #1e293b;
      --border-color: #334155;
      --text-main: #f8fafc;
      --text-sub: #94a3b8;
      --pass-bg: #064e3b;
      --pass-text: #34d399;
      --fail-bg: #1e293b;
      --fail-text: #64748b;
      --accent-blue: #38bdf8;
      --accent-red: #f87171;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-dark);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      padding: 20px;
      line-height: 1.5;
    }

    .container {
      max-width: 1200px;
      margin: 0 auto;
    }

    /* 상단 헤더 및 필터바 */
    header {
      margin-bottom: 24px;
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 16px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 16px;
    }

    h1 {
      font-size: 1.5rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .filter-group {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      align-items: center;
    }

    select, button {
      background-color: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border-color);
      padding: 6px 12px;
      border-radius: 6px;
      font-size: 0.875rem;
      cursor: pointer;
    }

    select:focus, button:focus {
      outline: 2px solid var(--accent-blue);
    }

    button:hover {
      background-color: #334155;
    }

    /* 카드 리스트 레이아웃 */
    .card-list {
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .card {
      background-color: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    /* 스크린샷 대응 뱃지 리스트 컨테이너 */
    .badge-container {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      padding-bottom: 10px;
      border-bottom: 1px dashed var(--border-color);
    }

    /* 체크 뱃지 기본 스타일 */
    .badge {
      font-size: 0.75rem;
      padding: 4px 8px;
      border-radius: 4px;
      font-weight: 500;
      border: 1px solid transparent;
      user-select: none;
      white-space: nowrap;
    }

    /* 통과(체크)된 뱃지 스타일 */
    .badge-pass {
      background-color: rgba(6, 78, 59, 0.4);
      color: var(--pass-text);
      border-color: #059669;
    }

    /* 미달성된 뱃지 스타일 */
    .badge-fail {
      background-color: rgba(15, 23, 42, 0.6);
      color: var(--fail-text);
      border-color: #1e293b;
    }

    /* 종목 기본 정보 영역 */
    .card-main {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      flex-wrap: wrap;
      gap: 12px;
    }

    .stock-title {
      display: flex;
      align-items: baseline;
      gap: 8px;
    }

    .stock-name {
      font-size: 1.25rem;
      font-weight: 700;
      color: #fff;
    }

    .stock-code {
      font-size: 0.85rem;
      color: var(--text-sub);
    }

    .market-badge {
      font-size: 0.7rem;
      padding: 2px 6px;
      border-radius: 4px;
      background-color: #0f172a;
      border: 1px solid var(--border-color);
      color: var(--text-sub);
    }

    .price-info {
      text-align: right;
    }

    .current-price {
      font-size: 1.25rem;
      font-weight: 700;
    }

    .change-rate {
      font-size: 0.9rem;
      font-weight: 600;
    }

    .rate-up { color: var(--accent-red); }
    .rate-down { color: var(--accent-blue); }

    /* 보조 상세 수치 그리드 */
    .detail-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
      gap: 8px 16px;
      background-color: rgba(15, 23, 42, 0.4);
      padding: 10px 12px;
      border-radius: 6px;
      font-size: 0.82rem;
    }

    .detail-item {
      display: flex;
      justify-content: space-between;
    }

    .detail-label {
      color: var(--text-sub);
    }

    .detail-value {
      font-weight: 600;
      color: var(--text-main);
    }

    /* 로딩 및 빈 상태 */
    .status-box {
      text-align: center;
      padding: 60px 20px;
      color: var(--text-sub);
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>📊 TRIPLE D PAPA <span style="font-size: 0.9rem; font-weight: 400; color: var(--text-sub);" id="updateDate"></span></h1>
      
      <div class="filter-group">
        <!-- 거래대금 필터 -->
        <select id="dealFilter" onchange="applyFilters()">
          <option value="ALL">전체 거래대금</option>
          <option value="200억이하">200억 이하 (100억~200억)</option>
          <option value="300억이하">300억 이하 (200억~300억)</option>
          <option value="400억이하">400억 이하 (300억~400억)</option>
          <option value="500억이하">500억 이하 (400억~500억)</option>
          <option value="500억이상">500억 초과</option>
        </select>

        <!-- 시장 필터 -->
        <select id="marketFilter" onchange="applyFilters()">
          <option value="ALL">전체 시장</option>
          <option value="KOSPI">KOSPI</option>
          <option value="KOSDAQ">KOSDAQ</option>
        </select>

        <button onclick="fetchStockData()">🔄 새로고침</button>
      </div>
    </header>

    <div id="loading" class="status-box">데이터를 불러오는 중입니다...</div>
    <div id="empty" class="status-box" style="display: none;">조건에 일치하는 종목이 없습니다.</div>
    <div class="card-list" id="cardList"></div>
  </div>

  <script>
    // Supabase 설정
    const SUPABASE_URL = "https://xnjnknhwezminpdmsrtm.supabase.co";
    const SUPABASE_KEY = "sb_publishable_qBB0Q_OsOCcHWtSNoXsyZg_raCUUTfn";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    // 스크린샷 UI 기반 체크 뱃지 항목 정의
    const SCREENER_CONDITIONS = [
      { key: "주가등락률", label: "주가등락률" },
      { key: "거래대금", label: "거래대금" },
      { key: "양봉마감", label: "양봉마감" },
      { key: "고가근접", label: "고가근접" },
      { key: "윗꼬리제한", label: "윗꼬리제한" },
      { key: "5일이평선", label: "5일이평선" },
      { key: "10일이평선", label: "10일이평선" },
      { key: "20일이평선", label: "20일이평선" },
      { key: "단기이평정배열", label: "단기이평정배열" },
      { key: "주가위치", label: "주가위치" },
      { key: "거래량100%", label: "거래량 100%" },
      { key: "거래량150%", label: "거래량 150%" },
      { key: "거래량200%", label: "거래량 200%" }
    ];

    let allStocks = [];

    // 체크 뱃지 목록 HTML 렌더링 함수
    function renderConditionBadges(passedTagsString) {
      const passedList = (passedTagsString || "").split(",");
      return SCREENER_CONDITIONS.map(cond => {
        const isPassed = passedList.includes(cond.key);
        return `
          <span class="badge ${isPassed ? 'badge-pass' : 'badge-fail'}">
            ${isPassed ? '✓ ' : ''}${cond.label}
          </span>
        `;
      }).join("");
    }

    // 데이터 조회
    async function fetchStockData() {
      const loadingEl = document.getElementById("loading");
      const emptyEl = document.getElementById("empty");
      const cardListEl = document.getElementById("cardList");

      loadingEl.style.display = "block";
      emptyEl.style.display = "none";
      cardListEl.innerHTML = "";

      try {
        const { data, error } = await supabaseClient
          .from("TRIPLE D PAPA")
          .select("*")
          .order("trade_amount", { ascending: false });

        loadingEl.style.display = "none";

        if (error) throw error;
        if (!data || data.length === 0) {
          emptyEl.style.display = "block";
          return;
        }

        allStocks = data;
        if (data[0] && data[0].date) {
          document.getElementById("updateDate").innerText = `(${data[0].date} 기준)`;
        }

        applyFilters();
      } catch (err) {
        loadingEl.innerText = "데이터 로딩 오류: " + err.message;
      }
    }

    // 필터 적용 및 카드 렌더링
    function applyFilters() {
      const dealVal = document.getElementById("dealFilter").value;
      const marketVal = document.getElementById("marketFilter").value;

      const filtered = allStocks.filter(item => {
        // 거래대금 태그 필터
        if (dealVal !== "ALL") {
          const tags = (item.passed_tags || "").split(",");
          if (!tags.includes(dealVal) && item.deal_tag !== dealVal) return false;
        }
        // 시장 필터
        if (marketVal !== "ALL" && item.market !== marketVal) {
          return false;
        }
        return true;
      });

      const cardListEl = document.getElementById("cardList");
      const emptyEl = document.getElementById("empty");

      if (filtered.length === 0) {
        cardListEl.innerHTML = "";
        emptyEl.style.display = "block";
        return;
      }

      emptyEl.style.display = "none";
      cardListEl.innerHTML = filtered.map(stock => {
        const isPlus = stock.change_rate > 0;
        const rateClass = isPlus ? "rate-up" : (stock.change_rate < 0 ? "rate-down" : "");
        const sign = isPlus ? "+" : "";

        // 이평선 표기 텍스트
        const maText = stock.ma_info ? stock.ma_info : 
          (stock.ma5 ? `5일: ${stock.ma5.toLocaleString()}원 | 10일: ${stock.ma10.toLocaleString()}원 | 20일: ${stock.ma20.toLocaleString()}원` : '-');

        // 거래대금 텍스트
        const dealText = stock.trade_amount_text ? stock.trade_amount_text : `${Math.round(stock.trade_amount / 100000000).toLocaleString()}억`;

        return `
          <div class="card">
            <!-- 조건 체크 뱃지 바 -->
            <div class="badge-container">
              ${renderConditionBadges(stock.passed_tags)}
            </div>

            <!-- 종목 헤더 정보 -->
            <div class="card-main">
              <div>
                <div class="stock-title">
                  <span class="stock-name">${stock.name}</span>
                  <span class="stock-code">${stock.ticker}</span>
                  <span class="market-badge">${stock.market}</span>
                </div>
                <div style="font-size: 0.85rem; color: var(--text-sub); margin-top: 4px;">
                  시가 ${(stock.open_price || 0).toLocaleString()}원
                </div>
              </div>
              <div class="price-info">
                <div class="current-price">${(stock.close_price || 0).toLocaleString()}원</div>
                <div class="change-rate ${rateClass}">${sign}${stock.change_rate}%</div>
              </div>
            </div>

            <!-- 상세 지표 그리드 -->
            <div class="detail-grid">
              <div class="detail-item">
                <span class="detail-label">거래대금</span>
                <span class="detail-value">${dealText}</span>
              </div>
              <div class="detail-item">
                <span class="detail-label">외인/기관</span>
                <span class="detail-value" style="color: ${stock.double_buy_sum > 0 ? 'var(--pass-text)' : 'inherit'}">
                  ${stock.double_buy_sum > 0 ? '★ 쌍끌이' : `외 ${(stock.foreign_net_buy || 0).toLocaleString()} / 기 ${(stock.inst_net_buy || 0).toLocaleString()}`}
                </span>
              </div>
              <div class="detail-item" style="grid-column: 1 / -1;">
                <span class="detail-label">이평선 (5/10/20)</span>
                <span class="detail-value">${maText}</span>
              </div>
            </div>
          </div>
        `;
      }).join("");
    }

    // 초기 실행
    window.addEventListener("DOMContentLoaded", fetchStockData);
  </script>
</body>
</html>
