<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TRIPLE D PAPA - 모바일 전광판</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-sub: #94a3b8;
      --red: #ef4444;
      --blue: #38bdf8;
      --accent: #38bdf8;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 16px; min-height: 100vh; }
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; padding-bottom: 12px; border-bottom: 1px solid var(--border); }
    h1 { font-size: 1.15rem; font-weight: 700; color: #fff; }
    .status-badge { display: flex; align-items: center; gap: 5px; font-size: 0.72rem; background-color: rgba(56, 189, 248, 0.15); color: var(--accent); padding: 3px 8px; border-radius: 999px; font-weight: 600; }
    .live-dot { width: 6px; height: 6px; background-color: #10b981; border-radius: 50%; display: inline-block; }
    
    .filter-bar { display: flex; gap: 8px; margin-bottom: 16px; }
    .filter-btn { flex: 1; padding: 8px; border-radius: 8px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text-sub); font-size: 0.85rem; font-weight: 600; cursor: pointer; }
    .filter-btn.active { background: var(--accent); color: #0f172a; border-color: var(--accent); }

    .summary-bar { display: flex; justify-content: space-between; font-size: 0.8rem; color: var(--text-sub); margin-bottom: 12px; }
    .stock-list { display: flex; flex-direction: column; gap: 12px; }
    .stock-card { background-color: var(--card-bg); border-radius: 12px; padding: 14px 16px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 10px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2); cursor: pointer; }
    
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .stock-info { display: flex; flex-direction: column; gap: 4px; }
    .stock-title-row { display: flex; align-items: center; gap: 6px; }
    .stock-name { font-size: 1.1rem; font-weight: 700; }
    .stock-market { font-size: 0.7rem; padding: 2px 5px; border-radius: 4px; font-weight: 600; }
    .market-KOSPI { background: #3b82f6; color: #fff; }
    .market-KOSDAQ { background: #10b981; color: #fff; }
    .stock-sub { font-size: 0.75rem; color: var(--text-sub); }

    .investor-bar { margin-top: 6px; display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
    .badge-inv { font-size: 0.7rem; padding: 2px 5px; border-radius: 4px; font-weight: 600; }
    .inv-buy { color: #f87171; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.25); }
    .inv-sell { color: #60a5fa; background: rgba(59, 130, 246, 0.15); border: 1px solid rgba(59, 130, 246, 0.25); }
    .inv-zero { color: var(--text-sub); background: rgba(148, 163, 184, 0.1); }

    .stock-values { text-align: right; display: flex; flex-direction: column; gap: 2px; }
    .stock-price { font-size: 1.15rem; font-weight: 700; color: #fff; }
    .stock-rate { font-size: 0.85rem; font-weight: 700; color: var(--red); }

    .card-bottom { display: flex; justify-content: space-between; align-items: center; padding-top: 8px; border-top: 1px dashed var(--border); font-size: 0.75rem; color: var(--text-sub); }
    .price-details { display: flex; gap: 8px; }
    .price-item span { color: #e2e8f0; font-weight: 600; }
    .amount-highlight { color: #e2e8f0; font-weight: 600; }
    .loading, .empty { text-align: center; padding: 40px 0; color: var(--text-sub); font-size: 0.9rem; }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>TRIPLE D PAPA</h1>
      <div id="target-date" style="font-size: 0.75rem; color: var(--text-sub); margin-top: 2px;">로딩 중...</div>
    </div>
    <div class="status-badge">
      <span class="live-dot"></span>
      <span id="refresh-status">30초 자동 갱신</span>
    </div>
  </header>

  <div class="filter-bar">
    <button class="filter-btn active" onclick="setFilter('ALL')">전체</button>
    <button class="filter-btn" onclick="setFilter('KOSPI')">코스피</button>
    <button class="filter-btn" onclick="setFilter('KOSDAQ')">코스닥</button>
  </div>

  <div class="summary-bar">
    <span id="summary-count">종목을 불러오는 중입니다...</span>
    <span id="last-updated" style="font-size: 0.72rem; color: var(--text-sub);"></span>
  </div>

  <div class="stock-list" id="stock-container">
    <div class="loading">데이터를 불러오고 있습니다...</div>
  </div>

  <script>
    const SUPABASE_URL = "https://xnjnknhwezminpdmsrtm.supabase.co";
    const SUPABASE_KEY = "sb_publishable_qBB0Q_OsOCcHWtSNoXsyZg_raCUUTfn";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    let allStocks = [];
    let currentFilter = 'ALL';

    function renderBadge(label, vol) {
      if (!vol || vol === 0) {
        return `<span class="badge-inv inv-zero">${label} 0</span>`;
      }
      const abs = Math.abs(vol);
      const text = abs >= 10000 ? (vol / 10000).toFixed(1) + "만" : Number(vol).toLocaleString();
      return vol > 0 
        ? `<span class="badge-inv inv-buy">${label} +${text}</span>` 
        : `<span class="badge-inv inv-sell">${label} ${text}</span>`;
    }

    async function loadTodayStocks() {
      try {
        const { data: latestRow, error: dateError } = await supabaseClient
          .from("TRIPLE D PAPA")
          .select("date")
          .order("date", { ascending: false })
          .limit(1);

        if (dateError || !latestRow || latestRow.length === 0) {
          showEmpty("저장된 주식 데이터가 없습니다.");
          return;
        }

        const latestDate = latestRow[0].date;
        document.getElementById("target-date").innerText = "기준일자: " + latestDate;

        const { data, error } = await supabaseClient
          .from("TRIPLE D PAPA")
          .select("*")
          .eq("date", latestDate)
          .order("trade_amount", { ascending: false });

        if (error || !data) {
          showEmpty("데이터를 불러오지 못했습니다.");
          return;
        }

        allStocks = data;
        renderList();

        const now = new Date();
        document.getElementById("last-updated").innerText = "최근 갱신: " + now.toLocaleTimeString('ko-KR', { hour12: false });
      } catch (e) {
        showEmpty("네트워크 오류가 발생했습니다.");
      }
    }

    function setFilter(market) {
      currentFilter = market;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      renderList();
    }

    function renderList() {
      const container = document.getElementById("stock-container");
      const filtered = currentFilter === 'ALL' 
        ? allStocks 
        : allStocks.filter(s => s.market === currentFilter);

      document.getElementById("summary-count").innerText = `총 ${filtered.length}개 종목 만족`;

      if (filtered.length === 0) {
        container.innerHTML = '<div class="empty">해당 조건의 종목이 없습니다.</div>';
        return;
      }

      container.innerHTML = filtered.map(s => {
        const amountEok = Math.round(s.trade_amount / 100000000).toLocaleString();
        const priceStr = Number(s.close_price).toLocaleString();
        const openStr = s.open_price ? Number(s.open_price).toLocaleString() : "-";
        const prevStr = s.prev_close ? Number(s.prev_close).toLocaleString() : "-";
        const rateStr = s.change_rate > 0 ? `+${s.change_rate}%` : `${s.change_rate}%`;

        return `
          <div class="stock-card" onclick="window.open('https://m.stock.naver.com/domestic/stock/${s.ticker}/total', '_blank')">
            <div class="card-top">
              <div class="stock-info">
                <div class="stock-title-row">
                  <span class="stock-market market-${s.market}">${s.market}</span>
                  <span class="stock-name">${s.name}</span>
                  <span class="stock-sub">${s.ticker}</span>
                </div>
                <div class="investor-bar">
                  ${renderBadge("외인", s.foreign_net_buy)}
                  ${renderBadge("기관", s.inst_net_buy)}
                  ${renderBadge("개인", s.retail_net_buy)}
                </div>
              </div>
              <div class="stock-values">
                <div class="stock-price">${priceStr}원</div>
                <div class="stock-rate">${rateStr}</div>
              </div>
            </div>
            
            <div class="card-bottom">
              <div class="price-details">
                <div class="price-item">전일 <span>${prevStr}</span></div>
                <div class="price-item">시가 <span>${openStr}</span></div>
              </div>
              <div class="amount-highlight">대금 ${amountEok}억</div>
            </div>
          </div>
        `;
      }).join('');
    }

    function showEmpty(msg) {
      document.getElementById("summary-count").innerText = "";
      document.getElementById("stock-container").innerHTML = `<div class="empty">${msg}</div>`;
    }

    loadTodayStocks();
    setInterval(loadTodayStocks, 30000);
  </script>
</body>
</html>
