<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>주식 조건검색 수집기</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #f8fafc;
      color: #1e293b;
      margin: 0;
      padding: 24px;
    }
    .container {
      max-width: 1000px;
      margin: 0 auto;
      background: #ffffff;
      padding: 24px;
      border-radius: 12px;
      box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
    }
    header {
      border-bottom: 2px solid #e2e8f0;
      padding-bottom: 16px;
      margin-bottom: 20px;
    }
    .header-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-top: 8px;
      font-size: 15px;
      color: #475569;
    }
    .badge {
      background-color: #e0f2fe;
      color: #0369a1;
      padding: 4px 10px;
      border-radius: 6px;
      font-weight: 600;
    }
    .status-badge {
      background-color: #f1f5f9;
      color: #334155;
      padding: 4px 10px;
      border-radius: 6px;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-top: 16px;
      font-size: 14px;
    }
    th, td {
      border: 1px solid #e2e8f0;
      padding: 10px 12px;
      text-align: center;
    }
    th {
      background-color: #f8fafc;
      font-weight: 600;
    }
    .text-red { color: #dc2626; font-weight: 600; }
    .text-blue { color: #2563eb; font-weight: 600; }
    .empty-state {
      text-align: center;
      padding: 40px;
      color: #94a3b8;
    }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1 style="margin: 0; font-size: 24px;">주식 조건검색 및 시세 수집 현황</h1>
      <div class="header-meta">
        <div>기준일자: <span id="base-date" class="badge">로딩 중...</span></div>
        <div>최종 갱신: <span id="last-updated">로딩 중...</span></div>
        <div>상태: <span id="status-text" class="status-badge">-</span></div>
      </div>
    </header>

    <div id="table-container">
      <table>
        <thead>
          <tr>
            <th>종목코드</th>
            <th>종목명</th>
            <th>현재가</th>
            <th>등락률</th>
            <th>당일 거래량</th>
            <th>이평선(5/10/20)</th>
            <th>PER</th>
            <th>PBR</th>
            <th>ROE</th>
            <th>RSI(14)</th>
          </tr>
        </thead>
        <tbody id="stock-list">
          <tr>
            <td colspan="10" class="empty-state">데이터를 불러오는 중입니다...</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

  <script>
    async function loadData() {
      try {
        // 브라우저 캐시 방지를 위해 타임스탬프 쿼리 스트링 추가
        const res = await fetch('./data.json?t=' + Date.now());
        if (!res.ok) throw new Error('데이터 파일을 찾을 수 없습니다.');
        const data = await res.json();

        // 1. 헤더 일자 및 상태 업데이트
        document.getElementById('base-date').textContent = data.base_date;
        document.getElementById('last-updated').textContent = data.last_updated;
        document.getElementById('status-text').textContent = data.status;

        // 2. 테이블 렌더링
        const tbody = document.getElementById('stock-list');
        tbody.innerHTML = '';

        if (!data.items || data.items.length === 0) {
          tbody.innerHTML = `<tr><td colspan="10" class="empty-state">조건에 부합하는 종목이 없거나 장 시작 전 대기 상태입니다.</td></tr>`;
          return;
        }

        data.items.forEach(stock => {
          const row = document.createElement('tr');
          const isUp = stock.diff_pct > 0;
          const diffClass = isUp ? 'text-red' : (stock.diff_pct < 0 ? 'text-blue' : '');
          const sign = isUp ? '+' : '';

          row.innerHTML = `
            <td>${stock.code}</td>
            <td style="font-weight:600;">${stock.name}</td>
            <td>${Number(stock.close).toLocaleString()}원</td>
            <td class="${diffClass}">${sign}${stock.diff_pct}%</td>
            <td>${Number(stock.volume).toLocaleString()}주</td>
            <td>${stock.ma_trend}</td>
            <td>${stock.per}배</td>
            <td>${stock.pbr}배</td>
            <td>${stock.roe}%</td>
            <td>${stock.rsi14}</td>
          `;
          tbody.appendChild(row);
        });
      } catch (err) {
        console.error(err);
        document.getElementById('base-date').textContent = '로드 실패';
        document.getElementById('stock-list').innerHTML = `<tr><td colspan="10" class="empty-state" style="color:#ef4444;">데이터 로드에 실패했습니다. GitHub Actions 상태를 확인하세요.</td></tr>`;
      }
    }

    loadData();
  </script>
</body>
</html>
