<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>TRIPLE D PAPA - 모바일 전광판</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    :root {
      --bg: #0f172a;
      --card-bg: #1e293b;
      --text: #f8fafc;
      --text-sub: #94a3b8;
      --red: #ef4444;
      --accent: #38bdf8;
      --border: #334155;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: var(--bg); color: var(--text); padding: 14px; min-height: 100vh; }
    
    header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid var(--border); }
    h1 { font-size: 1.15rem; font-weight: 700; color: #fff; }
    .status-badge { display: flex; align-items: center; gap: 5px; font-size: 0.72rem; background-color: rgba(56, 189, 248, 0.15); color: var(--accent); padding: 3px 8px; border-radius: 999px; font-weight: 600; }
    .live-dot { width: 6px; height: 6px; background-color: #10b981; border-radius: 50%; display: inline-block; }

    /* 코스피 / 코스닥 / 전체 선택 바 */
    .market-tab-bar { display: flex; gap: 8px; margin-bottom: 14px; }
    .tab-btn { flex: 1; padding: 9px 0; border-radius: 8px; border: 1px solid var(--border); background: var(--card-bg); color: var(--text-sub); font-size: 0.85rem; font-weight: 700; cursor: pointer; text-align: center; }
    .tab-btn.active { background: var(--accent); color: #0f172a; border-color: var(--accent); }

    .summary-bar { display: flex; justify-content: space-between; font-size: 0.78rem; color: var(--text-sub); margin-bottom: 12px; }
    .stock-list { display: flex; flex-direction: column; gap: 10px; }
    .stock-card { background-color: var(--card-bg); border-radius: 12px; padding: 12px 14px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.2); cursor: pointer; }
    
    .card-top { display: flex; justify-content: space-between; align-items: flex-start; }
    .stock-title-row { display: flex; align-items: center; gap: 6px; }
    .stock-name { font-size: 1.05rem; font-weight: 700; }
    .stock-market { font-size: 0.68rem; padding: 2px 5px; border-radius: 4px; font-weight: 600; }
    .market-KOSPI { background: #3b82f6; color: #fff; }
    .market-KOSDAQ { background: #10b981; color: #fff; }
    .score-badge { font-size: 0.7rem; background: rgba(56, 189, 248, 0.2); color: var(--accent); padding: 1px 6px; border-radius: 4px; font-weight: 700; }

    .investor-bar { margin-top: 4px; display: flex; gap: 4px; flex-wrap: wrap; }
    .badge-inv { font-size: 0.68rem; padding: 1px 4px; border-radius: 3px; font-weight: 600; }
    .inv-buy { color: #f87171; background: rgba(239, 68, 68, 0.15); }
    .inv-sell { color: #60a5fa; background: rgba(59, 130, 246, 0.15); }
    .inv-zero { color: var(--text-sub); background: rgba(148, 163, 184, 0.1); }

    .stock-values { text-align: right; display: flex; flex-direction: column; gap: 2px; }
    .stock-price { font-size: 1.1rem; font-weight: 700; color: #fff; }
    .stock-rate { font-size: 0.82rem; font-weight: 700; color: var(--red); }

    /* 9대 조건 통과 칩 */
    .chips-box { display: flex; flex-wrap: wrap; gap: 4px; padding-top: 6px; border-top: 1px dashed var(--border); }
    .chip { font-size: 0.65rem; padding: 2px 5px; border-radius: 4px; font-weight: 500; }
    .chip-pass { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .chip-fail { background: rgba(51, 65, 85, 0.4); color: #64748b; }

    .card-bottom { display: flex; justify-content: space-between; align-items: center; font-size: 0.72rem; color: var(--text-sub); }
    .amount-highlight { color: #e2e8f0; font-weight: 600; }
    .loading, .empty { text-align: center; padding: 40px 0; color: var(--text-sub); font-size: 0.85rem; }
  </style>
</head>
<body>

  <header>
    <div>
      <h1>TRIPLE D PAPA</h1>
      <div id="target-date" style="font-size: 0.72rem; color: var(--text-sub); margin-top: 2px;">로딩 중...</div>
    </div>
    <div class="status-badge">
      <span class="live-dot"></span>
      <span>30초 갱신</span>
    </div>
  </header>

  <!-- 코스피 / 코스닥 선택 탭 -->
  <div class="market-tab-bar">
    <button class="tab-btn active" onclick="setMarketFilter('ALL')">전체</button>
    <button class="tab-btn" onclick="setMarketFilter('KOSPI')">코스피</button>
    <button class="tab-btn" onclick="setMarketFilter('KOSDAQ')">코스닥</button>
  </div>

  <div class="summary-bar">
    <span id="summary-count">불러오는 중...</span>
    <span id="last-updated"></span>
  </div>

  <div class="stock-list" id="stock-container">
    <div class="loading">데이터를 불러오고 있습니다...</div>
  </div>

  <script>
    const SUPABASE_URL = "https://xnjnknhwezminpdmsrtm.supabase.co";
    const SUPABASE_KEY = "sb_publishable_qBB0Q_OsOCcHWtSNoXsyZg_raCUUTfn";
    const supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

    const ALL_CONDS = ["주가등락률", "거래대금", "거래량비율", "20일이평선", "주가위치", "양봉마감", "고가근접", "윗꼬리제한", "단기이평정배열"];
    let allStocks = [];
    let currentMarket = 'ALL';

    function renderBadge(label, vol) {
      if (!vol || vol === 0) return `<span class="badge-inv inv-zero">${label} 0</span>`;
      const abs = Math.abs(vol);
      const text = abs >= 10000 ? (vol / 10000).toFixed(1) + "만" : Number(vol).toLocaleString();
      return vol > 0 ? `<span class="badge-inv inv-buy">${label} +${text}</span>` : `<span class="badge-inv inv-sell">${label} ${text}</span>`;
    }

    async function loadStocks() {
      try {
        const { data: latestRow } = await supabaseClient.from("TRIPLE D PAPA").select("date").order("date", { ascending: false }).limit(1);
        if (!latestRow || latestRow.length === 0) {
          document.getElementById("stock-container").innerHTML = '<div class="empty">저장된 데이터가 없습니다.</div>';
          return;
        }

        const latestDate = latestRow[0].date;
        document.getElementById("target-date").innerText = "기준: " + latestDate;

        const { data } = await supabaseClient.from("TRIPLE D PAPA").select("*").eq("date", latestDate).order("trade_amount", { ascending: false });
        if (data) {
          allStocks = data;
          renderList();
          document.getElementById("last-updated").innerText = new Date().toLocaleTimeString('ko-KR', { hour12: false });
        }
      } catch (e) {}
    }

    function setMarketFilter(market) {
      currentMarket = market;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      event.target.classList.add('active');
      renderList();
    }

    function renderList() {
      const container = document.getElementById("stock-container");
      
      const filtered = currentMarket === 'ALL' 
        ? allStocks 
        : allStocks.filter(s => s.market === currentMarket);

      document.getElementById("summary-count").innerText = `총 ${filtered.length}개 종목`;

      if (filtered.length === 0) {
        container.innerHTML = '<div class="empty">해당 시장의 종목이 없습니다.</div>';
        return;
      }

      container.innerHTML = filtered.map(s => {
        const tags = (s.passed_tags || "").split(',');
        const score = s.pass_count || tags.filter(t => t).length;
        const amountEok = Math.round(s.trade_amount / 100000000).toLocaleString();

        const chipsHtml = ALL_CONDS.map(c => {
          const pass = tags.includes(c);
          return `<span class="chip ${pass ? 'chip-pass' : 'chip-fail'}">${pass ? '✔ ' : ''}${c}</span>`;
        }).join('');

        return `
          <div class="stock-card" onclick="window.open('https://m.stock.naver.com/domestic/stock/${s.ticker}/total', '_blank')">
            <div class="card-top">
              <div class="stock-info">
                <div class="stock-title-row">
                  <span class="stock-market market-${s.market}">${s.market}</span>
                  <span class="stock-name">${s.name}</span>
                  <span class="score-badge">${score}/9 통과</span>
                </div>
                <div class="investor-bar">
                  ${renderBadge("외인", s.foreign_net_buy)}
                  ${renderBadge("기관", s.inst_net_buy)}
                  ${renderBadge("개인", s.retail_net_buy)}
                </div>
              </div>
              <div class="stock-values">
                <div class="stock-price">${Number(s.close_price).toLocaleString()}원</div>
                <div class="stock-rate">${s.change_rate > 0 ? '+' : ''}${s.change_rate}%</div>
              </div>
            </div>

            <div class="chips-box">
              ${chipsHtml}
            </div>

            <div class="card-bottom">
              <span>전일 ${Number(s.prev_close || 0).toLocaleString()} · 시가 ${Number(s.open_price || 0).toLocaleString()}</span>
              <span class="amount-highlight">대금 ${amountEok}억</span>
            </div>
          </div>
        `;
      }).join('');
    }

    loadStocks();
    setInterval(loadStocks, 30000);
  </script>
</body>
</html>
